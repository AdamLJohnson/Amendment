# Amendment GraphQL API - Phase 5.
# Default auth is the Cognito user pool. Anonymous projectors use the Lambda authorizer (decision D21) and can reach
# only fields marked @aws_lambda; those fields and types also carry @aws_cognito_user_pools so signed-in users keep access.
# Amendment reads resolve directly against DynamoDB; mutations and the presentation reads go through the .NET 10 API
# Lambda (decisions D15, D22).
# Versions are decimal strings of 64-bit integers (decision D19: AppSync has no 64-bit integer scalar).
# Role rules are enforced server-side by RoleOperationMatrix (docs/modernization/contracts.md section 4).

enum BodyStatus { NEW DRAFT UNDER_REVIEW READY }
enum ApprovalFailureMode { ALL_OR_NOTHING BEST_EFFORT }

type Audit { by: ID! at: AWSDateTime! }

type Amendment {
  id: ID!
  title: String!
  author: String!
  motion: String
  source: String
  legisId: String
  primaryLanguage: String!
  isArchived: Boolean!
  isApproved: Boolean!
  parentAmendmentId: ID
  version: String!
  created: Audit!
  updated: Audit!
  bodies: [AmendmentBody!]!
}

type AmendmentBody {
  amendmentId: ID!
  language: String!
  markdown: String!
  status: BodyStatus!
  pageCount: Int!
  version: String!
  created: Audit!
  updated: Audit!
}

type AmendmentConnection { items: [Amendment!]! nextToken: String }

type Language @aws_lambda @aws_cognito_user_pools { code: String! name: String! sortOrder: Int! }

# Operator view of PRESENTATION#MAIN (Screen Control).
type LanguageScreen { language: String! visible: Boolean! page: Int! }

type Presentation {
  activeAmendmentId: ID
  languages: [LanguageScreen!]!
  version: String!
  updated: Audit
}

# Public projector read model (decision D6): markdown and bodyVersion are set only for visible languages.
type PublicLanguageView @aws_lambda @aws_cognito_user_pools {
  language: String!
  visible: Boolean!
  page: Int!
  pageCount: Int!
  markdown: String
  bodyVersion: String
}

type PublicPresentation @aws_lambda @aws_cognito_user_pools {
  version: String!
  activeAmendmentId: ID
  languages: [PublicLanguageView!]!
}

input LanguageChangeInput { language: String! visible: Boolean page: Int }

type ApprovalResult {
  amendment: Amendment!
  approvalApplied: Boolean!
  updatedChildLanguages: [String!]!
  updatedParentLanguages: [String!]!
  warnings: [String!]!
}

input AmendmentInput {
  title: String!
  author: String!
  primaryLanguage: String!
  motion: String
  source: String
  legisId: String
  parentAmendmentId: ID
}

type Query {
  apiVersion: String!
  amendments(archived: Boolean = false, limit: Int = 50, nextToken: String): AmendmentConnection!
  amendment(id: ID!): Amendment
  languages: [Language!]! @aws_lambda @aws_cognito_user_pools
  presentation: Presentation!
  publicPresentation: PublicPresentation! @aws_lambda @aws_cognito_user_pools
}

type Mutation {
  createAmendment(input: AmendmentInput!): Amendment!
  updateAmendment(id: ID!, expectedVersion: String!, input: AmendmentInput!, isApproved: Boolean!): Amendment!
  archiveAmendment(id: ID!, expectedVersion: String!, archived: Boolean!): Amendment!
  cloneAmendment(sourceId: ID!, overrides: AmendmentInput): Amendment!
  approveAmendment(id: ID!, expectedVersion: String!, cleanChildBodies: Boolean = true,
                   failureMode: ApprovalFailureMode = ALL_OR_NOTHING): ApprovalResult!
  deleteAmendment(id: ID!, expectedVersion: String!): ID!

  createAmendmentBody(amendmentId: ID!, language: String!, markdown: String!, status: BodyStatus = NEW): AmendmentBody!
  updateAmendmentBody(amendmentId: ID!, language: String!, expectedVersion: String!, markdown: String!, status: BodyStatus!): AmendmentBody!
  deleteAmendmentBody(amendmentId: ID!, language: String!, expectedVersion: String!): String!

  presentAmendment(id: ID!, expectedVersion: String!): Presentation!
  clearPresentation(expectedVersion: String!): Presentation!
  setLanguagePresentation(expectedVersion: String!, changes: [LanguageChangeInput!]!): Presentation!
}
